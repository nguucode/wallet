name: CI & deploy

on:
  # push to main = test + deploy to production; PRs into main = test + build only
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-spec
      - run: npm test
      # build runs tsc -b first, so it doubles as the typecheck
      - run: npm run build
      # wallet.ontheshore.biz is the custom domain on the Cloudflare Pages project "wallet" (Direct Upload, so deploys come from here)
      - if: github.ref == 'refs/heads/main'
        run: npx -y wrangler@4 pages deploy dist --project-name=wallet --branch=main --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
